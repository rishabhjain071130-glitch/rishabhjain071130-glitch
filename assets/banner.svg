<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%" style="border-radius: 8px;">
  <style>
    .terminal-bg {
      fill: #090B12;
      stroke: #1B365D;
      stroke-width: 2;
    }
    .title-bar {
      fill: #111420;
      stroke: #1B365D;
      stroke-width: 1;
    }
    .title-text {
      font-family: 'JetBrains Mono', 'Fira Code', Monaco, Consolas, monospace;
      font-size: 13px;
      fill: #B0B3B8;
      font-weight: 500;
      text-anchor: middle;
    }
    .text-line {
      font-family: 'JetBrains Mono', 'Fira Code', Monaco, Consolas, monospace;
      font-size: 14px;
      fill: #E2E8F0;
      opacity: 0;
      animation: fadeIn 0.4s ease-out forwards;
    }
    .prompt {
      fill: #00F0FF;
      font-weight: bold;
    }
    .command {
      fill: #FFFFFF;
    }
    .status-ok {
      fill: #27C93F;
      font-weight: bold;
    }
    .brand-accent {
      fill: #4F7CFF;
      font-weight: bold;
    }
    .welcome-text {
      fill: #00F0FF;
      font-weight: bold;
    }
    .cursor {
      fill: #00F0FF;
      animation: blink 0.8s infinite;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .l1 { animation-delay: 0.2s; }
    .l2 { animation-delay: 0.8s; }
    .l3 { animation-delay: 1.4s; }
    .l4 { animation-delay: 2.0s; }
    .l5 { animation-delay: 2.6s; }
    .l6 { animation-delay: 3.2s; }
    .l7 { animation-delay: 3.8s; }
  </style>

  <!-- Terminal Window Shadow & BG -->
  <rect x="1" y="1" width="798" height="278" rx="8" class="terminal-bg" />

  <!-- Title Bar -->
  <path d="M1,9 A8,8 0 0,1 9,1 L791,1 A8,8 0 0,1 799,9 L799,32 L1,32 Z" class="title-bar" />

  <!-- Window Controls (macOS style) -->
  <circle cx="20" cy="16" r="6" fill="#FF5F56" />
  <circle cx="40" cy="16" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="16" r="6" fill="#27C93F" />

  <!-- Title Text -->
  <text x="400" y="21" class="title-text">rishabh@portfolio-os: ~</text>

  <!-- Terminal Content -->
  <!-- Line 1: Shell Prompt -->
  <text x="25" y="65" class="text-line l1">
    <tspan class="prompt">rishabh@portfolio-os:~$</tspan> <tspan class="command">sh boot.sh --brand="Portfolio OS"</tspan>
  </text>

  <!-- Line 2: Kernel Init -->
  <text x="25" y="95" class="text-line l2">
    [ <tspan class="status-ok">OK</tspan> ] Initializing core Portfolio OS modules...
  </text>

  <!-- Line 3: Load Profile -->
  <text x="25" y="125" class="text-line l3">
    [ <tspan class="status-ok">OK</tspan> ] Loading Developer Profile: <tspan class="brand-accent">Rishabh Jain</tspan> (CS Student, Cyber Security &amp; AI)
  </text>

  <!-- Line 4: Check Security -->
  <text x="25" y="155" class="text-line l4">
    [ <tspan class="status-ok">OK</tspan> ] Verification complete. Defensive Coding &amp; OWASP Standards verified.
  </text>

  <!-- Line 5: Mount AI Mentorship -->
  <text x="25" y="185" class="text-line l5">
    [ <tspan class="status-ok">OK</tspan> ] Initialized Offline AI Mentorship Agent (Vercel/Next.js/Tailwind).
  </text>

  <!-- Line 6: Welcome Message -->
  <text x="25" y="215" class="text-line l6">
    [ <tspan class="status-ok">OK</tspan> ] Welcome back. Boot process completed in <tspan class="brand-accent">142ms</tspan>.
  </text>

  <!-- Line 7: Banner welcome text and blinking cursor -->
  <text x="25" y="245" class="text-line l7">
    <tspan class="welcome-text">portfolio-os login:</tspan> active | <tspan class="brand-accent">recruiter_session</tspan> load success. <tspan class="prompt">_</tspan>
  </text>
</svg>
