<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%" style="border-radius: 8px;">
  <style>
    .window-bg {
      fill: #090B12;
      stroke: #1B365D;
      stroke-width: 2;
    }
    .title-bar {
      fill: #111420;
      stroke: #1B365D;
      stroke-width: 1;
    }
    .title-text {
      font-family: 'JetBrains Mono', 'Fira Code', Monaco, Consolas, monospace;
      font-size: 12px;
      fill: #B0B3B8;
      text-anchor: middle;
    }
    .code-text {
      font-family: 'JetBrains Mono', 'Fira Code', Monaco, Consolas, monospace;
      font-size: 13px;
      fill: #E2E8F0;
    }
    .keyword { fill: #FF79C6; }
    .string { fill: #F1FA8C; }
    .function { fill: #50FA7B; }
    .comment { fill: #6272A4; font-style: italic; }
    .prompt { fill: #00F0FF; font-weight: bold; }
    .accent { fill: #4F7CFF; }
  </style>

  <!-- Background -->
  <rect x="1" y="1" width="598" height="298" rx="8" class="window-bg" />

  <!-- Title Bar -->
  <path d="M1,9 A8,8 0 0,1 9,1 L591,1 A8,8 0 0,1 599,9 L599,30 L1,30 Z" class="title-bar" />
  
  <!-- Window Controls -->
  <circle cx="15" cy="15" r="5" fill="#FF5F56" />
  <circle cx="30" cy="15" r="5" fill="#FFBD2E" />
  <circle cx="45" cy="15" r="5" fill="#27C93F" />
  <text x="300" y="20" class="title-text">secure_connection.py</text>

  <!-- Code / Terminal content -->
  <text x="25" y="60" class="code-text">
    <tspan class="comment"># Developer: Rishabh Jain | CS Student &amp; Security Builder</tspan>
  </text>
  
  <text x="25" y="90" class="code-text">
    <tspan class="keyword">import</tspan> security, ai, fullstack
  </text>

  <text x="25" y="120" class="code-text">
    <tspan class="keyword">def</tspan> <tspan class="function">engineer_software</tspan>(developer):
  </text>

  <text x="45" y="150" class="code-text">
    profile = security.Audit(developer)
  </text>

  <text x="45" y="180" class="code-text">
    <tspan class="keyword">if</tspan> profile.complies_with_owasp():
  </text>

  <text x="65" y="210" class="code-text">
    ai_agent = ai.load_agent(<tspan class="string">"EduPilot-AI"</tspan>)
  </text>

  <text x="65" y="240" class="code-text">
    <tspan class="keyword">return</tspan> fullstack.deploy(ai_agent, secure=<tspan class="keyword">True</tspan>)
  </text>

  <!-- CLI Prompt at bottom -->
  <text x="25" y="275" class="code-text">
    <tspan class="prompt">rishabh@portfolio:~$</tspan> python secure_connection.py <tspan class="accent">--status=success</tspan>
  </text>
</svg>
